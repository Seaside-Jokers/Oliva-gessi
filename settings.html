<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title data-key="settings_title">Impostazioni · Oliva Gessi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Personalizza tema e lingua del sito di Oliva Gessi">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preload" href="fonts/Playfair_Display/PlayfairDisplay-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/Montserrat/Montserrat-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="src/style.css">
    <link rel="alternate" hreflang="it" href="https://oliva-gessi.vercel.app/settings.html?lang=it">
    <link rel="alternate" hreflang="en" href="https://oliva-gessi.vercel.app/settings.html?lang=en">
    <link rel="alternate" hreflang="x-default" href="https://oliva-gessi.vercel.app/settings.html">
    <link rel="icon" href="assets/favicon.png" type="image/x-icon">
    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fdf5ec">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#150d03">
    <!-- Vercel Speed Insights -->
    <script>
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
    <!-- Vercel Web Analytics -->
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <!-- ======================================================================= -->
    <!--                                 NAVBAR                                  -->
    <!-- ======================================================================= -->
    <!-- ======================================================================= -->
    <!--                  LAYOUT (navbar + sidebar, generato da layout.js)       -->
    <!-- ======================================================================= -->
    <div id="layout-root">
        <noscript>
            <nav class="noscript-nav">
                <a href="index.html">Home</a>
                <a href="about-us.html">Team</a>
                <a href="storia.html">Storia</a>
                <a href="castello.html">Castello</a>
                <a href="luoghi.html">Luoghi</a>
                <a href="personaggi.html">Personaggi</a>
                <a href="settings.html">Impostazioni</a>
            </nav>
        </noscript>
    </div>
    <!-- ======================================================================= -->
    <!--                                CONTENUTO                                -->
    <!-- ======================================================================= -->
  <main>
    <h1 class="titolo-blocco" data-key="settings">Impostazioni</h1>
    <div class="settings-block" role="group" aria-labelledby="tema-label">
        <p id="tema-label" data-key="cambio_colore" class="settings-title">Cambia tema:</p>
        <button data-key="sys_default" class="settings-item selected tema" id="def_theme"
            onclick="setDefault()" type="button" aria-pressed="true">
            Default
        </button>
        <button data-key="light_mode" class="settings-item tema" id="light_theme"
            onclick="setLight()" type="button" aria-pressed="false">
            Chiaro
        </button>
        <button data-key="dark_mode" class="settings-item tema" id="dark_theme"
            onclick="setDark()" type="button" aria-pressed="false">
            Scuro
        </button>
        <p data-key="settings_theme_hint" class="settings-hint">"Default" segue automaticamente il tema del tuo dispositivo.</p>
    </div>
    <div class="settings-block" role="group" aria-labelledby="lingua-label">
        <p id="lingua-label" data-key="cambio_lingua" class="settings-title">Cambia lingua:</p>
        <button data-key="lang_default" class="settings-item selected lingua" id="def-lang"
                onclick="setDefaultLang()" type="button" aria-pressed="true">
            Default
        </button>
        <button data-key="ita" class="settings-item lingua" id="ita-lang"
                onclick="setIta()" type="button" aria-pressed="false">
            Italiano
        </button>
        <button data-key="eng" class="settings-item lingua" id="eng-lang"
                onclick="setEng()" type="button" aria-pressed="false">
            Inglese
        </button>
        <p data-key="settings_lang_hint" class="settings-hint">"Default" usa la lingua del tuo browser.</p>
    </div>
    <div class="settings-block" role="group" aria-labelledby="dimensione-label">
        <p id="dimensione-label" data-key="cambio_dimensione" class="settings-title">Dimensione testo:</p>
        <button data-key="size_normal" class="settings-item selected dimensione" id="size-normal"
                onclick="setSizeNormal()" type="button" aria-pressed="true">
            Normale
        </button>
        <button data-key="size_large" class="settings-item dimensione" id="size-large"
                onclick="setSizeLarge()" type="button" aria-pressed="false">
            Grande
        </button>
        <button data-key="size_xlarge" class="settings-item dimensione" id="size-xlarge"
                onclick="setSizeXLarge()" type="button" aria-pressed="false">
            Molto grande
        </button>
        <p data-key="settings_size_hint" class="settings-hint">Regola la dimensione di testo e spaziature in tutto il sito.</p>
    </div>
    <div class="settings-block">
        <button data-key="reset_settings" class="settings-item" id="reset-settings"
                onclick="resetAllSettings()" type="button">
            Ripristina impostazioni predefinite
        </button>
    </div>
  </main>
    <!-- ======================================================================= -->
    <!--                      DO NOT TOUCH BELOW THIS LINE                       -->
    <!-- ======================================================================= -->
    <script src="src/database_testo.js" defer></script>
    <script src="src/color_scheme.js" defer></script>
    <script src="src/text_size.js" defer></script>
    <script src="src/sidebar.js" defer></script>
    <script src="src/layout.js" defer></script>
    <script src="src/search.js" defer></script>
    <script src="src/homepage.js" defer></script>
    <script src="src/icon_manager.js" defer></script>
    <script src="src/settings.js" defer></script>
</body>
</html>
